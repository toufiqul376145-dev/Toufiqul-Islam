<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Drift Runner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="game-ui">
    <button id="hud-pause-btn" class="hud-btn hidden" type="button">Pause</button>

    <div id="menu-panel" class="menu-panel">
      <div class="brand">NEON DRIFT</div>
      <h1>RUNNER</h1>
      <p id="menu-status">Dodge danger, collect coins, and chase the streak.</p>

      <div class="stats-row">
        <div class="stat-pill"><span>Best</span><strong id="best-score-label">0</strong></div>
        <div class="stat-pill"><span>Coins</span><strong id="coin-total-label">0</strong></div>
      </div>

      <div class="controls-text">Controls: Space / Tap = jump • P = pause • M = mute</div>

      <div class="menu-buttons">
        <button id="start-btn" class="menu-btn primary" type="button">Start Game</button>
        <button id="pause-btn" class="menu-btn secondary" type="button">Pause</button>
        <button id="theme-btn" class="menu-btn accent" type="button">Night Mode</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
